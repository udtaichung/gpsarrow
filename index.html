<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="軌跡箭頭">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>軌跡箭頭</title>
<style>
  :root{
    --ink:#ffffff;
    --bg:#000000;
    --dim:#6b6b6b;
    --warn:#ffb000;
    --alarm:#d40000;
    --turn:#0b2f66;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition:background-color .12s linear;
  }
  /* 前方有轉彎：只染「要轉過去的那半邊」。右轉染右半、左轉染左半，
     用餘光就能判斷方向，不必讀橫幅上的字。下格的 canvas 是透明的，
     所以這道分界會同時貫穿上下兩格。
     偏離（紅）優先，故 .off 規則排在後面覆蓋。 */
  body.turnR{background:linear-gradient(to right, var(--bg) 50%, var(--turn) 50%)}
  body.turnL{background:linear-gradient(to right, var(--turn) 50%, var(--bg) 50%)}
  body.off{background:var(--alarm)}
  body.off.pulse{background:#ff1a1a}

  /* ---------- 起始畫面 ---------- */
  #start{
    position:fixed;inset:0;z-index:20;background:var(--bg);
    display:flex;flex-direction:column;justify-content:center;gap:22px;
    padding:32px;overflow-y:auto;
  }
  #start h1{font-size:26px;font-weight:600;letter-spacing:-.01em}
  #start p{color:var(--dim);font-size:15px;line-height:1.6;max-width:34em}
  #start.hide{display:none}
  .file{
    border:1px solid #333;border-radius:10px;padding:18px;
    display:flex;flex-direction:column;gap:12px;
  }
  .file input{color:var(--dim);font-size:14px}
  #status{font-size:14px;color:var(--warn);min-height:1.4em}
  #dir{
    display:none;align-items:center;justify-content:space-between;gap:12px;
    border-top:1px solid #262626;padding-top:12px;
  }
  #dir.show{display:flex}
  #dirText{font-size:13px;color:var(--dim);line-height:1.5;flex:1;min-width:0}
  #dirText b{color:var(--ink);font-weight:600}
  #revStart{
    flex:0 0 auto;background:none;border:1px solid #333;color:var(--ink);
    font-family:inherit;font-size:14px;border-radius:8px;padding:11px 14px;
  }
  #go{
    background:var(--ink);color:#000;border:0;border-radius:10px;
    padding:22px;font-size:21px;font-weight:650;font-family:inherit;
  }
  #go:disabled{background:#2a2a2a;color:#666}
  #hint{font-size:13px}
  #hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ---------- 主畫面 ---------- */
  .bar{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;
    padding:10px 20px 0;
  }
  .metric{display:flex;flex-direction:column;gap:2px}
  .metric.r{align-items:flex-end}
  .metric b{font-size:36px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .metric span{font-size:12px;color:var(--dim)}
  body.off .metric span,
  body.turn .metric span{color:rgba(255,255,255,.75)}

  /* 上格：箭頭 */
  #stage{flex:1 1 50%;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  #arrow{height:88%;width:auto;aspect-ratio:1/1;max-width:92%;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
  /* 尖角導圓：用同色的粗描邊配 stroke-linejoin:round，圓角半徑即線寬的一半，
     比在路徑裡手刻圓弧簡單得多。注意只有凸角會被圓化——箭尾的 V 形凹角
     反而會被描邊撐得更尖，要圓化它得改路徑本身。 */
  #arrow path{
    fill:var(--ink);stroke:var(--ink);
    stroke-width:9;stroke-linejoin:round;stroke-linecap:round;
  }
  #arrow .ret path{stroke-width:7}
  body.stale #arrow path{fill:#4a4a4a;stroke:#4a4a4a}
  body.turn.stale #arrow path{fill:rgba(255,255,255,.45);stroke:rgba(255,255,255,.45)}
  /* 紅屏上灰箭頭幾乎看不見，改用半透明白：仍表示方向不可靠，但讀得到 */
  body.off.stale #arrow path{fill:rgba(255,255,255,.45);stroke:rgba(255,255,255,.45)}
  /* 循跡箭頭與「回到軌跡」箭頭是兩個不同圖形，紅屏下一眼可辨 */
  #arrow .ret{display:none}
  body.off #arrow .nav{display:none}
  body.off #arrow .ret{display:inline}
  /* 最近點在身後：整個箭頭閃爍，提醒該掉頭而不是硬往前 */
  @keyframes uturn{0%,100%{opacity:1}50%{opacity:.35}}
  body.off.back #arrow{animation:uturn 1s ease-in-out infinite}

  #banner{
    position:absolute;bottom:4%;left:0;right:0;text-align:center;
    font-size:18px;font-weight:600;letter-spacing:.02em;
  }

  /* 下格：軌跡形狀 */
  #mapWrap{
    flex:1 1 50%;position:relative;min-height:0;
    border-top:1px solid #1e1e1e;
  }
  body.off #mapWrap,
  body.turn #mapWrap{border-top-color:rgba(255,255,255,.35)}
  #map{display:block;width:100%;height:100%}
  #mapTag{
    position:absolute;top:6px;left:14px;font-size:11px;color:var(--dim);
    letter-spacing:.04em;pointer-events:none;
  }
  body.off #mapTag,
  body.turn #mapTag{color:rgba(255,255,255,.8)}

  .foot{
    flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
    padding:8px 20px 12px;font-size:13px;color:var(--dim);
  }
  body.off .foot,
  body.turn .foot{color:rgba(255,255,255,.8)}
  .foot button{
    background:none;border:1px solid #333;color:inherit;font-family:inherit;
    font-size:13px;border-radius:7px;padding:9px 14px;
  }
  body.off .foot button,
  body.turn .foot button{border-color:rgba(255,255,255,.45)}
  .fbtns{display:flex;gap:8px}
  .foot button:disabled{opacity:.4}
  /* 偏離時「導航回軌跡」是當下最該按的鍵：反白突顯，並放大到戴手套、
     車身晃動時也按得到（觸控目標約 48px 高）。 */
  body.off #gmap{
    background:#fff;color:var(--alarm);border-color:#fff;
    font-weight:700;font-size:16px;padding:14px 20px;
  }
  body.off .foot{padding-bottom:14px}

  /* ---------- 設定 ---------- */
  #panel{
    position:fixed;inset:auto 0 0 0;z-index:15;background:#0c0c0c;
    border-top:1px solid #262626;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    display:none;flex-direction:column;gap:18px;max-height:86vh;overflow-y:auto;
  }
  #panel.show{display:flex}
  .row{display:flex;flex-direction:column;gap:8px}
  .row label{font-size:14px;color:var(--ink);display:flex;justify-content:space-between}
  .row label i{font-style:normal;color:var(--dim)}
  .row input[type=range]{width:100%;accent-color:#fff}
  /* 騎乘中滑桿難以精準拖動，範圍改用大面積的 ＋／－ 按鍵 */
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{
    flex:0 0 72px;height:54px;background:none;border:1px solid #333;color:var(--ink);
    font-family:inherit;font-size:26px;line-height:1;border-radius:10px;
  }
  .stepper button:disabled{opacity:.3}
  .stepper .val{flex:1;text-align:center;font-size:20px;font-weight:600}
  .toggles{display:flex;gap:10px;flex-wrap:wrap}
  .toggles button{
    flex:1;min-width:120px;background:none;border:1px solid #333;color:var(--ink);
    font-family:inherit;font-size:14px;border-radius:8px;padding:13px;
  }
  .toggles button.on{background:var(--ink);color:#000;border-color:var(--ink)}
</style>
</head>
<body class="stale">

<!-- 起始畫面 -->
<section id="start">
  <div>
    <h1>軌跡箭頭</h1>
    <p>螢幕上方＝你的前進方向。上格箭頭指向前方的軌跡，下格顯示前方 30–200 公尺的軌跡形狀。偏離超過設定距離整片轉紅並震動；前方 50 公尺內有 60° 以上的轉彎，則要轉過去的那半邊轉暗藍並提示。</p>
  </div>
  <div class="file">
    <!-- 不設 accept：iOS 的檔案 App 依 UTI 過濾，.gpx 沒有註冊的 UTI，
         寫了 accept 反而會把 GPX 檔整個變灰選不到；Android 上不少檔案
         提供者也把 .gpx 回報成 application/octet-stream，一樣會被濾掉。 -->
    <input type="file" id="picker">
    <div id="status">請選擇 GPX 檔</div>
    <div id="dir">
      <div id="dirText"></div>
      <button id="revStart">反轉</button>
    </div>
  </div>
  <button id="go" disabled>開始</button>
  <p id="hint">把 GPX 放在同一個資料夾，用 <code>?gpx=檔名.gpx</code> 開啟就會自動載入。</p>
</section>

<!-- 主畫面 -->
<div class="bar">
  <div class="metric"><b id="dev">–</b><span id="devLabel">偏離 公尺</span></div>
  <div class="metric r"><b id="spd">–</b><span>km/h</span></div>
</div>

<div id="stage">
  <svg id="arrow" viewBox="0 0 100 100" aria-hidden="true">
    <!-- 循跡：實心箭頭 -->
    <path class="nav" d="M50 6 L88 78 L50 60 L12 78 Z"/>
    <!-- 回到軌跡：箭頭指向一條代表軌跡的橫線 -->
    <g class="ret">
      <path d="M6 8 H94 V19 H6 Z"/>
      <path d="M50 26 L78 58 L61 58 L61 94 L39 94 L39 58 L22 58 Z"/>
    </g>
  </svg>
  <div id="banner"></div>
</div>

<div id="mapWrap">
  <canvas id="map"></canvas>
  <div id="mapTag">前方 100 m</div>
</div>

<div class="foot">
  <div id="remain">剩餘 –</div>
  <div class="fbtns">
    <button id="gmap">地圖</button>
    <button id="gear">設定</button>
  </div>
</div>

<!-- 設定 -->
<section id="panel">
  <div class="row">
    <label>偏離警告距離 <i><span id="thrV">25</span> m</i></label>
    <input type="range" id="thr" min="10" max="150" step="5" value="25">
  </div>
  <div class="row">
    <label>箭頭前瞻距離 <i><span id="lkV">60</span> m</i></label>
    <input type="range" id="lk" min="20" max="200" step="10" value="60">
  </div>
  <div class="row">
    <label>方向平滑 <i>前 <span id="smV">5</span> 秒的位移</i></label>
    <div class="stepper">
      <button id="smDn" aria-label="縮短視窗">−</button>
      <div id="smNow" class="val">5 秒</div>
      <button id="smUp" aria-label="拉長視窗">＋</button>
    </div>
  </div>
  <div class="row">
    <label>路寬補償 <i>±<span id="lnV">3</span> m</i></label>
    <div class="stepper">
      <button id="lnDn" aria-label="減少補償">−</button>
      <div id="lnNow" class="val">±3 m</div>
      <button id="lnUp" aria-label="增加補償">＋</button>
    </div>
  </div>
  <div class="row">
    <label>下格顯示範圍 <i><span id="rgV">100</span> m</i></label>
    <div class="stepper">
      <button id="rgDn" aria-label="縮小範圍">−</button>
      <div id="rgNow" class="val">100 m</div>
      <button id="rgUp" aria-label="放大範圍">＋</button>
    </div>
  </div>
  <div class="toggles">
    <button id="snd" class="on">警告音 開</button>
    <button id="rev">反轉軌跡方向</button>
  </div>
  <div class="toggles">
    <button id="gmapHere">Google 地圖：目前位置</button>
    <button id="gmapBack">Google 地圖：導航回軌跡</button>
  </div>
  <div class="toggles">
    <button id="mapApp" class="on">地圖用 App 開啟</button>
  </div>
  <div class="toggles">
    <button id="resync">重新定位到軌跡</button>
    <button id="close">關閉</button>
  </div>
</section>

<script>
(() => {
'use strict';

/* ======================= 幾何 ======================= */
const R = 6371000, D2R = Math.PI/180;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function haversine(a, b){
  const dphi = (b.lat-a.lat)*D2R, dlam = (b.lon-a.lon)*D2R;
  const p1 = a.lat*D2R, p2 = b.lat*D2R;
  const h = Math.sin(dphi/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dlam/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
// 以 ref 為原點的平面近似（公尺），短距離誤差可忽略
function proj(p, ref){
  return {
    x: (p.lon-ref.lon)*D2R*Math.cos(ref.lat*D2R)*R,
    y: (p.lat-ref.lat)*D2R*R
  };
}
function bearing(a, b){
  const p1 = a.lat*D2R, p2 = b.lat*D2R, dlam = (b.lon-a.lon)*D2R;
  const y = Math.sin(dlam)*Math.cos(p2);
  const x = Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(dlam);
  return (Math.atan2(y,x)/D2R + 360) % 360;
}
const wrap180 = d => ((d + 540) % 360) - 180;

/* ======================= 狀態 ======================= */
const S = {
  raw: [], track: [], cum: [], total: 0,
  idx: 0, locked: false, rev: false,
  thr: 25, look: 60, range: 100, sound: true, mapApp: true,
  lane: 3, side: 0, smooth: 5, trace: [], hhist: [],
  gpsHead: null, gpsHeadAt: 0,
  compass: null,
  pos: null, posAt: 0, speed: 0,
  off: false, lastBeep: 0, offRuns: 0,
  turn: null, lastTurnBeep: 0,
  shown: 0, bin: null,
  near: null, along: 0, mapHead: 0
};

// 下格顯示範圍的級距：低段密（市區看轉彎細節），高段疏（郊區看大方向）
const RANGES = [30, 40, 50, 60, 70, 80, 90, 100, 125, 150, 175, 200];
// 路寬補償的級距：半個車道約 1.75 m，靠路邊騎大約 2–4 m
const LANES = [0, 1, 1.5, 2, 2.5, 3, 3.5, 4, 5, 6];
// 方向平滑的視窗長度（秒）。0 = 直接用 GPS 回報的 heading
const SMOOTHS = [0, 2, 3, 5, 8, 12];
const nearestRange = v => RANGES.reduce((a, b) => Math.abs(b-v) < Math.abs(a-v) ? b : a, RANGES[0]);
const nearestLane  = v => LANES.reduce((a, b) => Math.abs(b-v) < Math.abs(a-v) ? b : a, LANES[0]);
const nearestSmooth= v => SMOOTHS.reduce((a, b) => Math.abs(b-v) < Math.abs(a-v) ? b : a, SMOOTHS[0]);

const $ = id => document.getElementById(id);
const el = {
  start:$('start'), picker:$('picker'), status:$('status'), go:$('go'),
  dir:$('dir'), dirText:$('dirText'),
  dev:$('dev'), devLabel:$('devLabel'), spd:$('spd'), arrow:$('arrow'),
  banner:$('banner'), remain:$('remain'), panel:$('panel'), gmap:$('gmap'),
  map:$('map'), mapTag:$('mapTag'), hint:$('hint')
};
const ctx = el.map.getContext('2d');

/* ======================= 設定保存 ======================= */
const PREF = 'gpsarrow.prefs';
const PREF_V = 2;
function savePrefs(){
  try {
    localStorage.setItem(PREF, JSON.stringify({
      v:PREF_V,
      thr:S.thr, look:S.look, range:S.range, lane:S.lane, smooth:S.smooth,
      sound:S.sound, rev:S.rev, mapApp:S.mapApp
    }));
  } catch(e){}
}
function loadPrefs(){
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PREF) || 'null'); } catch(e){}
  if (!p) return;
  if (Number.isFinite(p.thr))   S.thr   = clamp(p.thr, 10, 150);
  // 只改預設值不會影響已經用過的裝置——設定一經保存就會蓋掉新預設。
  // v1 的預設偏離門檻是 40 m，但市區平行的那條街常常就在 40 m 內，
  // 整段騎錯路都不會叫，故改為 25 m。舊設定若正好停在當時的預設值，
  // 視為「沒調過」而跟著改；自己調過的值一律不動。
  if ((Number.isFinite(p.v) ? p.v : 1) < 2 && p.thr === 40) S.thr = 25;
  if (Number.isFinite(p.look))  S.look  = clamp(p.look, 20, 200);
  // 舊版存的是 100–500，超出新範圍的值靠攏到最接近的級距
  if (Number.isFinite(p.range)) S.range = nearestRange(clamp(p.range, 30, 200));
  if (Number.isFinite(p.lane))  S.lane  = nearestLane(clamp(p.lane, 0, 6));
  if (Number.isFinite(p.smooth)) S.smooth = nearestSmooth(clamp(p.smooth, 0, 12));
  if (typeof p.sound === 'boolean') S.sound = p.sound;
  if (typeof p.mapApp === 'boolean') S.mapApp = p.mapApp;
  if (typeof p.rev === 'boolean')   S.rev   = p.rev;
}

/* ======================= GPX ======================= */
// GPX 沒有「方向」欄位，點的排列順序本身就是方向：
// 第一個 trkpt 是起點、最後一個是終點。反轉＝把順序倒過來。
function parseGPX(text){
  // BOM 或開頭的空白會讓 XML 解析器抱怨「宣告不在文件開頭」，先清掉
  const src = String(text).replace(/^﻿/, '').replace(/^\s+/, '');
  // 0 位元組多半是檔案還沒下載／同步完就被選走了
  if (!src) throw new Error('檔案是空的（0 位元組）——可能還沒下載完，等一下再選一次');

  let doc = new DOMParser().parseFromString(src, 'application/xml');
  let bad = doc.querySelector('parsererror');
  if (bad){                                   // 有些檔案改用 text/xml 才過得了
    doc = new DOMParser().parseFromString(src, 'text/xml');
    bad = doc.querySelector('parsererror');
  }
  if (bad){
    // 各家瀏覽器的 parsererror 都包著一堆樣板文字，只留 "error on line…" 那段
    const raw = (bad.textContent || '').replace(/\s+/g, ' ').trim();
    const m = raw.match(/error on line[^]*/i) || raw.match(/:\s*(.+)$/);
    const why = (m ? (m[1] || m[0]) : raw)
      .split(/Below is a rendering/i)[0].trim().slice(0, 90);
    throw new Error('GPX 解析失敗：' + (why || '格式不正確'));
  }

  // 用 NS 版本依「本地名稱」比對：有些 GPX 的節點帶前綴（<gpx:trkpt>），
  // getElementsByTagName 比對的是含前綴的全名，會整個抓不到。
  const pick = n => {
    let r = [...doc.getElementsByTagNameNS('*', n)];
    if (!r.length) r = [...doc.getElementsByTagName(n)];
    return r;
  };
  let nodes = pick('trkpt');
  if (!nodes.length) nodes = pick('rtept');
  if (!nodes.length) nodes = pick('wpt');
  if (!nodes.length){
    throw new Error('檔案裡找不到軌跡點（trkpt／rtept／wpt），根節點是 <'
      + (doc.documentElement ? doc.documentElement.nodeName : '?') + '>');
  }
  const pts = nodes.map(n => ({
    lat: parseFloat(n.getAttribute('lat')),
    lon: parseFloat(n.getAttribute('lon'))
  })).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  if (pts.length < 2) throw new Error(`只讀到 ${pts.length} 個有效座標，至少需要 2 個`);
  return pts;
}
function loadTrack(pts){
  S.track = pts;
  S.cum = [0];
  for (let i=1; i<pts.length; i++) S.cum[i] = S.cum[i-1] + haversine(pts[i-1], pts[i]);
  S.total = S.cum[S.cum.length-1];
  S.idx = 0; S.locked = false; S.near = null; S.along = 0;
}
// 原始點序另外保存，反轉可以無限次來回切換而不失真
function setTrack(pts, name){ S.raw = pts; applyDirection(); if (name !== undefined) saveTrack(name); }

/* ---------- 軌跡持久化 ----------
   軌跡只放在記憶體裡是不行的：切到 Google 地圖看久一點，手機記憶體
   一吃緊就會把背景網頁回收，切回來是整頁重新載入。用檔案選擇器選的
   GPX 這時已經救不回來，得在山上重選一次檔案。
   座標改存成 1e6 定點整數再做差分：相鄰點相距 5–10 m 只差 50–90，
   每點約 8 個字元，一萬個點約 80 KB，長軌跡也塞得進 localStorage。 */
const TRACK_KEY = 'gpsarrow.track';
const RIDE_KEY  = 'gpsarrow.riding';
function saveTrack(name){
  try {
    const p = S.raw;
    if (!p || p.length < 2) return;
    let la = Math.round(p[0].lat*1e6), lo = Math.round(p[0].lon*1e6);
    const lat0 = la, lon0 = lo, d = [];
    for (let i = 1; i < p.length; i++){
      const a = Math.round(p[i].lat*1e6), b = Math.round(p[i].lon*1e6);
      d.push((a-la) + ',' + (b-lo));
      la = a; lo = b;
    }
    localStorage.setItem(TRACK_KEY, JSON.stringify(
      {v:1, name:name || '軌跡', lat0, lon0, d:d.join(';'), at:Date.now()}));
  } catch(e){
    // 配額不足等情況就放棄保存，不影響騎乘本身
    try { localStorage.removeItem(TRACK_KEY); } catch(e2){}
  }
}
function loadSavedTrack(){
  try {
    const o = JSON.parse(localStorage.getItem(TRACK_KEY) || 'null');
    if (!o || o.v !== 1 || !Number.isFinite(o.lat0)) return null;
    let la = o.lat0, lo = o.lon0;
    const pts = [{lat: la/1e6, lon: lo/1e6}];
    if (o.d) for (const s of o.d.split(';')){
      const c = s.split(',');
      la += +c[0]; lo += +c[1];
      if (!Number.isFinite(la) || !Number.isFinite(lo)) return null;
      pts.push({lat: la/1e6, lon: lo/1e6});
    }
    return pts.length >= 2 ? {pts, name:o.name, at:o.at} : null;
  } catch(e){ return null; }
}
function applyDirection(){
  loadTrack(S.rev ? S.raw.slice().reverse() : S.raw.slice());
}
// 起點→終點的直線方位，用文字描述給使用者確認方向對不對
const COMPASS16 = ['北','北北東','東北','東北東','東','東南東','東南','南南東',
                   '南','南南西','西南','西南西','西','西北西','西北','北北西'];
function compassName(deg){ return COMPASS16[Math.round(((deg%360)+360)%360 / 22.5) % 16]; }

/* ======================= 軌跡比對 ======================= */
// 回傳距離最近的線段投影點
function nearestOnTrack(pos, from, to){
  let best = {d:Infinity, i:from, t:0};
  for (let i=from; i<to; i++){
    const A = proj(S.track[i], pos), B = proj(S.track[i+1], pos);
    const dx = B.x-A.x, dy = B.y-A.y, L2 = dx*dx + dy*dy;
    let t = L2 > 0 ? (-(A.x*dx + A.y*dy))/L2 : 0;
    t = clamp(t, 0, 1);
    const d = Math.hypot(A.x + t*dx, A.y + t*dy);
    if (d < best.d) best = {d, i, t};
  }
  // 偏在軌跡的哪一側（正 = 右側）。之後要靠它補償「軌跡在路中心、
  // 人卻靠路邊騎」造成的固定橫向偏移。
  const A = proj(S.track[best.i], pos), B = proj(S.track[best.i+1], pos);
  const dx = B.x-A.x, dy = B.y-A.y, L = Math.hypot(dx, dy);
  const px = A.x + best.t*dx, py = A.y + best.t*dy;
  best.side = L > 0 ? (py*dx - px*dy)/L : 0;
  return best;
}
// 自 p 沿方位 brg 前進 m 公尺（m 可為負）
function movePoint(p, brg, m){
  const b = brg*D2R;
  return {
    lat: p.lat + (m*Math.cos(b))/(D2R*R),
    lon: p.lon + (m*Math.sin(b))/(D2R*R*Math.cos(p.lat*D2R))
  };
}
function idxAt(dist){
  const d = clamp(dist, 0, S.total);
  let lo = 0, hi = S.cum.length-1;
  while (lo < hi-1){
    const mid = (lo+hi) >> 1;
    if (S.cum[mid] <= d) lo = mid; else hi = mid;
  }
  return lo;
}
// 依累積里程取軌跡上的點（線性內插）
function pointAt(dist){
  const d = clamp(dist, 0, S.total);
  const lo = idxAt(d), hi = lo+1;
  const seg = S.cum[hi] - S.cum[lo];
  const t = seg > 0 ? (d - S.cum[lo]) / seg : 0;
  return {
    lat: S.track[lo].lat + t*(S.track[hi].lat - S.track[lo].lat),
    lon: S.track[lo].lon + t*(S.track[hi].lon - S.track[lo].lon)
  };
}
// 取 [d0,d1] 區間的實際折線頂點，端點以內插補齊（保留真實轉角）
function polyline(d0, d1){
  const a = clamp(d0, 0, S.total), b = clamp(d1, 0, S.total);
  if (b <= a) return [];
  const out = [pointAt(a)];
  for (let i = idxAt(a)+1; i < S.cum.length && S.cum[i] < b; i++) out.push(S.track[i]);
  out.push(pointAt(b));
  return out;
}

/* ======================= 轉彎偵測 ======================= */
// 不能看單一節點的轉角：密集 GPX 上一個 80 m 半徑的彎，每個節點只轉 2°，
// 但整段轉了 90°。所以改看前方一段距離內的「累積轉向量」。
// 方位本身也以 ±5 m 的弦線計算，避免 GPS 抖動造成的鋸齒被當成轉彎。
// 只警示「真正的轉彎」：總轉角 90°±30°。
// 關鍵是不能用固定長度的視窗量角度——一個 R=50 m 的 90° 彎弧長 78 m，
// 在 40 m 視窗內只量到 46°，會被漏掉。必須先把彎當成一個完整的段落
// 辨識出來（連續同向轉動的區段），再量它的總轉角。
const TURN_SPAN     = 50;   // 彎起點需落在前方多少公尺內才提示
// 下界目標 60°，平均弦線量測會系統性低估約 2–3°（實測 90° 量到
// 88°、120° 量到 118°），因此下界外擴 3° 到 57°，60° 的折角才不會漏。
const TURN_MIN      = 57;   // ≈ 60°（90° − 30°）
const TURN_MAX      = 190;  // 髮夾彎與迴轉的總轉角更大，卻更需要提前知道，故不設實質上限
const TURN_HOLD_MIN = 25;   // 已在彎中時放寬下限，避免轉到一半熄掉
const TURN_HOLD_MAX = 360;  // 已在彎中時不設上限
const TURN_STEP     = 5;    // 取樣步長
const TURN_CHORD    = 15;   // 計算方位的弦線半長（見 trackBearingAt）
const TURN_STRAIGHT = 2.5;  // 每 5 m 轉不到此角度視為直行（≈ 半徑 115 m 以上）
const TURN_GAP      = 3;    // 彎中容許連續 3 個取樣（15 m）接近直行
const TURN_SCAN     = 200;  // 往前取樣總長，需容納得下整個彎
// 右轉標記的綠色：亮度 230（Rec.709 亮度 Y' = 0.2126R + 0.7152G + 0.0722B）。
// 綠色分量開滿 255 只到 182，其餘由等量的 R/B 補足以維持純綠色相：
//   0.2126×167 + 0.7152×255 + 0.0722×167 = 229.9
// 左轉維持白色，兩者在暗藍底上都夠亮。
const TURN_R_COLOR  = '#a7ffa7';

// 實測的坑：GPX 是 GPS 錄的，本身就帶雜訊。用單一短弦線算方位時，
// ±3 m 的橫向雜訊就會造成 ±30° 的方位誤差，直線路段誤報連連。
// 改成兩側各取三點求平均後再連線，雜訊約降到 1/√3，直線段誤報歸零。
const TURN_TAPS = [1, 0.66, 0.33];
function meanPoint(d, sign){
  let lat = 0, lon = 0;
  for (const f of TURN_TAPS){
    const p = pointAt(clamp(d + sign*f*TURN_CHORD, 0, S.total));
    lat += p.lat; lon += p.lon;
  }
  return {lat: lat/TURN_TAPS.length, lon: lon/TURN_TAPS.length};
}
function trackBearingAt(d){
  const a = meanPoint(d, -1), b = meanPoint(d, +1);
  return haversine(a, b) < 1 ? null : bearing(a, b);
}
function turnAhead(from, holding){
  if (S.total - from < 20) return null;
  const minDeg = holding ? TURN_HOLD_MIN : TURN_MIN;
  const maxDeg = holding ? TURN_HOLD_MAX : TURN_MAX;

  // 沿軌跡取一排方位，差分得到每 5 m 的轉動量
  const bs = [];
  for (let k = 0; k <= Math.round(TURN_SCAN/TURN_STEP); k++){
    const d = from + k*TURN_STEP;
    bs.push(d > S.total ? null : trackBearingAt(d));
  }
  const dd = [];
  for (let k = 0; k + 1 < bs.length; k++){
    dd.push(bs[k] === null || bs[k+1] === null ? 0 : wrap180(bs[k+1] - bs[k]));
  }

  // 把連續同向轉動的取樣併成一個「彎」。中間容許短暫接近直行（TURN_GAP），
  // 否則一個彎會被 GPS 抖動切成好幾段。
  const runs = [];
  let cur = null;
  for (let k = 0; k < dd.length; k++){
    const v = dd[k];
    const s = Math.abs(v) < TURN_STRAIGHT ? 0 : Math.sign(v);
    if (cur){
      if (s === cur.s){ cur.sum += v; cur.gap = 0; }
      else if (s === 0){ if (++cur.gap > TURN_GAP){ runs.push(cur); cur = null; } }
      else { runs.push(cur); cur = {s, sum:v, start:k, gap:0}; }
    } else if (s !== 0){
      cur = {s, sum:v, start:k, gap:0};
    }
  }
  if (cur) runs.push(cur);

  // runs 已依距離排序，取最近且落在提示範圍內的那一個
  for (const r of runs){
    const dist = r.start*TURN_STEP;
    if (dist > TURN_SPAN) break;
    const a = Math.abs(r.sum);
    if (a >= minDeg && a <= maxDeg){
      return {deg: r.sum, dir: r.sum > 0 ? 'R' : 'L', dist};
    }
  }
  return null;
}
// 轉彎提示音與偏離警告音刻意不同：正弦波、兩個音。
// 右轉升調、左轉降調，不低頭也能分辨方向。
function turnBeep(dir){
  if (!S.sound) return;
  try {
    const a = ac(); if (!a) return;
    const t = a.currentTime;
    (dir === 'R' ? [620, 900] : [900, 620]).forEach((hz, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = hz;
      const at = t + i*0.17;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.3, at+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.15);
      o.connect(g); g.connect(a.destination);
      o.start(at); o.stop(at+0.17);
    });
  } catch(e){}
}

/* ======================= 感測 ======================= */
const TRACE_KEEP  = 15000;   // 位置歷史保留多久（毫秒）
const TRACE_MIN_M = 5;       // 兩端平均點至少要相距這麼遠，方向才有意義

function onPosition(p){
  const c = p.coords;
  S.pos = {lat:c.latitude, lon:c.longitude};
  S.posAt = Date.now();
  S.speed = Number.isFinite(c.speed) && c.speed >= 0 ? c.speed : 0;
  // 騎乘中 GPS 航向遠比電子羅盤可靠（車把上的手機受金屬與震動干擾）
  if (Number.isFinite(c.heading) && S.speed > 1.2){
    S.gpsHead = c.heading; S.gpsHeadAt = S.posAt;
  }
  S.trace.push({lat:c.latitude, lon:c.longitude, t:S.posAt});
  while (S.trace.length && S.posAt - S.trace[0].t > TRACE_KEEP) S.trace.shift();
  const rh = rawHeading();
  if (rh !== null) S.hhist.push({h:rh, t:S.posAt});
  while (S.hhist.length && S.posAt - S.hhist[0].t > TRACE_KEEP) S.hhist.shift();
  update();
}

// 以前幾秒的「位移」推算行進方向，比 GPS 單次回報的 heading 平穩得多。
// 但不能只連「N 秒前那一點」和「現在這一點」——兩端的 GPS 雜訊會直接
// 變成方向誤差。兩端各取半個視窗求平均，單點雜訊才會互相抵銷。
// 代價是延遲約半個視窗（5 秒視窗約延遲 2.5 秒），轉彎時會慢半拍，
// 所以視窗長度做成可調的。
function meanOf(pts){
  let la = 0, lo = 0;
  for (const p of pts){ la += p.lat; lo += p.lon; }
  return {lat: la/pts.length, lon: lo/pts.length};
}
function traceHeading(winMs){
  const now = S.posAt;
  let i = 0;
  while (i < S.trace.length && now - S.trace[i].t > winMs) i++;
  const w = S.trace.slice(i);
  if (w.length < 4) return null;
  const half = Math.max(2, Math.floor(w.length/2));
  const a = meanOf(w.slice(0, half));                 // 較舊那半
  const b = meanOf(w.slice(w.length - half));         // 較新那半
  if (haversine(a, b) < TRACE_MIN_M) return null;     // 幾乎沒動，方向無意義
  return bearing(a, b);
}

// 單次的原始方向。GPS 自己回報的 heading 是都卜勒推算的，在行進速度下
// 誤差只有一兩度，比從位置反推準得多——實測位置雜訊 ±3 m 經 5 秒視窗
// 平均後仍有 3.3° 抖動，比 GPS heading 的 1.2° 還差。所以位移推算只當
// 備援：有些裝置根本不給 heading，這時它遠勝於車把上不可靠的電子羅盤。
function rawHeading(){
  if (S.gpsHead !== null && S.posAt - S.gpsHeadAt < 8000) return S.gpsHead;
  const th = traceHeading(Math.max(5000, S.smooth*1000));
  if (th !== null) return th;
  if (S.compass !== null) return S.compass;
  return null;
}
// 平滑是對「方向」本身做加權平均，不是重新從位置推算方向。
// 權重隨時間線性遞減（最新為 1、視窗邊緣為 0），重心落在視窗的 1/3 處，
// 所以延遲約為視窗的 1/3 而非一半——同樣的平順度，反應快一倍。
function heading(){
  const last = S.hhist.length ? S.hhist[S.hhist.length-1] : null;
  if (!last) return rawHeading();
  if (S.smooth <= 0) return S.posAt - last.t < 8000 ? last.h : rawHeading();
  const win = S.smooth * 1000;
  let x = 0, y = 0, wsum = 0;
  for (const s of S.hhist){
    const age = S.posAt - s.t;
    if (age > win) continue;
    const w = 1 - age/win;
    x += w*Math.cos(s.h*D2R); y += w*Math.sin(s.h*D2R); wsum += w;
  }
  if (!wsum) return rawHeading();
  return (Math.atan2(y, x)/D2R + 360) % 360;
}
function onOrient(e){
  if (typeof e.webkitCompassHeading === 'number') S.compass = e.webkitCompassHeading;
  else if (e.absolute && typeof e.alpha === 'number') S.compass = (360 - e.alpha) % 360;
}
function initCompass(){
  const DOE = window.DeviceOrientationEvent;
  if (!DOE) return;
  const attach = () => {
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
  };
  if (typeof DOE.requestPermission === 'function'){
    DOE.requestPermission().then(s => { if (s === 'granted') attach(); }).catch(()=>{});
  } else attach();
}

/* ======================= 警告 ======================= */
let audio = null;
function ac(){
  if (!audio){
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    audio = new C();
  }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}
// 借使用者手勢解鎖 iOS 音訊，但不發出聲音
function unlockAudio(){
  try {
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    g.gain.value = 0;
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + 0.02);
  } catch(e){}
}
function beep(){
  if (!S.sound) return;
  try {
    const a = ac(); if (!a) return;
    const t = a.currentTime;
    [0, 0.22].forEach(delay => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t+delay);
      g.gain.exponentialRampToValueAtTime(0.35, t+delay+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+delay+0.16);
      o.connect(g); g.connect(a.destination);
      o.start(t+delay); o.stop(t+delay+0.18);
    });
  } catch(e){}
}
function alarm(){
  const now = Date.now();
  // 持續偏離時逐次拉長間隔：8s → 16s → 32s → 60s（刻意繞路不會一直震）
  const gap = Math.min(8000 * Math.pow(2, Math.max(0, S.offRuns-1)), 60000);
  if (S.offRuns > 0 && now - S.lastBeep < gap) return;
  S.lastBeep = now;
  S.offRuns++;
  beep();
  if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
  document.body.classList.add('pulse');
  setTimeout(() => document.body.classList.remove('pulse'), 260);
}

/* ======================= 下格：軌跡形狀 ======================= */
function sizeMap(){
  const dpr = window.devicePixelRatio || 1;
  const w = el.map.clientWidth, h = el.map.clientHeight;
  if (!w || !h) return;
  el.map.width = Math.round(w*dpr);
  el.map.height = Math.round(h*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawMap();
}
function drawMap(){
  const W = el.map.clientWidth, H = el.map.clientHeight;
  if (!W || !H) return;
  ctx.clearRect(0, 0, W, H);
  ctx.font = '11px system-ui, -apple-system, sans-serif';

  if (!S.track.length || !S.pos || !S.near){
    ctx.fillStyle = '#4a4a4a';
    ctx.textAlign = 'center';
    ctx.fillText(S.track.length ? '等待定位' : '尚未載入軌跡', W/2, H/2);
    return;
  }

  const rng = S.range;
  const cx = W/2, cy = H*0.80;              // 騎士固定在下方，前方視野較大
  const scale = (H*0.76) / rng;
  const hr = S.mapHead * D2R, sh = Math.sin(hr), ch = Math.cos(hr);
  // 前進方向朝上：f 為前方分量、r 為右側分量
  const toScreen = p => {
    const q = proj(p, S.pos);
    return [cx + (q.x*ch - q.y*sh)*scale, cy - (q.x*sh + q.y*ch)*scale];
  };
  const stroke = (pts, color, width, dash) => {
    if (pts.length < 2) return;
    ctx.beginPath();
    pts.forEach((p, i) => {
      const s = toScreen(p);
      i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]);
    });
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.setLineDash(dash || []);
    ctx.stroke();
    ctx.setLineDash([]);
  };
  const onRed = S.off;            // 回歸虛線等紅屏專屬元素
  const tinted = S.off || !!S.turn;   // 深色背景（紅或藍）下的對比切換

  // 距離刻度
  ctx.strokeStyle = tinted ? 'rgba(255,255,255,.28)' : '#242424';
  ctx.fillStyle   = tinted ? 'rgba(255,255,255,.7)'  : '#555';
  ctx.textAlign = 'right';   // 靠右，避開左上角的「前方 N m」標籤
  ctx.lineWidth = 1;
  [rng/2, rng].forEach(d => {
    const y = cy - d*scale;
    if (y < 2) return;
    ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.moveTo(8, y); ctx.lineTo(W-8, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillText(Math.round(d) + ' m', W-10, y - 4);
  });

  // 偏離門檻圈。門檻比視野還遠時（例如 30 m 視野配 40 m 門檻），圓圈
  // 整個落在格子外，畫出來只剩一道撐滿畫面的弧線，沒有資訊，此時不畫。
  if (S.thr < rng){
    ctx.strokeStyle = tinted ? 'rgba(255,255,255,.45)' : '#333';
    ctx.setLineDash([2, 4]);
    ctx.beginPath(); ctx.arc(cx, cy, S.thr*scale, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 走過的一段（暗）與前方一段（亮）
  stroke(polyline(S.along - rng*0.5, S.along), tinted ? 'rgba(255,255,255,.4)' : '#3a3a3a', 3);
  stroke(polyline(S.along, S.along + rng*1.25), '#ffffff', 4);

  // 起點（空心方塊）與終點（雙圈），只在進入視野範圍時畫
  const mark = (p, kind) => {
    const s = toScreen(p);
    if (s[0] < -40 || s[0] > W+40 || s[1] < -40 || s[1] > H+40) return;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    if (kind === 'start'){
      ctx.strokeRect(s[0]-5, s[1]-5, 10, 10);
    } else {
      ctx.beginPath(); ctx.arc(s[0], s[1], 8, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(s[0], s[1], 3.5, 0, Math.PI*2); ctx.stroke();
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = tinted ? 'rgba(255,255,255,.9)' : '#bbb';
    ctx.fillText(kind === 'start' ? '起' : '終', s[0], s[1] - 12);
  };
  if (S.along < rng*0.5) mark(S.track[0], 'start');
  if (S.total - S.along < rng*1.25) mark(S.track[S.track.length-1], 'end');

  // 前方轉彎點：菱形標記 + 左右字樣
  if (S.turn){
    const tp = toScreen(pointAt(S.along + S.turn.dist));
    if (tp[0] > -30 && tp[0] < W+30 && tp[1] > -30 && tp[1] < H+30){
      const right = S.turn.dir === 'R';
      ctx.fillStyle = right ? TURN_R_COLOR : '#ffffff';
      ctx.beginPath();
      ctx.moveTo(tp[0], tp[1]-9); ctx.lineTo(tp[0]+9, tp[1]);
      ctx.lineTo(tp[0], tp[1]+9); ctx.lineTo(tp[0]-9, tp[1]);
      ctx.closePath(); ctx.fill();
      // 標在轉彎的那一側，否則字會壓在軌跡線上看不清
      ctx.textAlign = right ? 'left' : 'right';
      ctx.fillStyle = right ? TURN_R_COLOR : 'rgba(255,255,255,.95)';
      ctx.fillText(right ? '右' : '左', tp[0] + (right ? 15 : -15), tp[1] + 4);
    }
  }

  // 偏離時，畫一條指回最近軌跡點的線，並標上距離
  if (onRed){
    const n = toScreen(pointAt(S.along));
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(n[0], n[1]); ctx.stroke();
    ctx.setLineDash([]);
    // 最近點（回去的目標）畫一個實心點，和起訖點記號區分開
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(n[0], n[1], 4, 0, Math.PI*2); ctx.fill();
    ctx.textAlign = 'center';
    // 偏離很遠時最近點會落在畫面外，距離標籤仍要留在可視範圍內
    ctx.fillText(Math.round(S.near.d) + ' m',
      clamp((cx+n[0])/2, 26, W-26), clamp((cy+n[1])/2 - 6, 14, H-6));
  }

  // 騎士
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(cx, cy-8); ctx.lineTo(cx+6, cy+7); ctx.lineTo(cx, cy+3); ctx.lineTo(cx-6, cy+7);
  ctx.closePath(); ctx.fill();
}

/* ======================= Google 地圖 ======================= */
// 箭頭只知道直線方向，可能指著一條河或一道牆的另一邊。真的迷路時，
// 「照現有道路怎麼回去」要交給 Google 地圖。
//
// 一定要開「App」而不是網頁：開 App 只是切換前景，本頁在背景保持存在，
// 切回來就繼續；開網頁（尤其 iOS standalone 下的應用內瀏覽器）等於離開
// 箭頭畫面，回來可能要重新載入、重新定位。
// 三種平台各有各的正確做法，見下方各函式。

const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// 一律不傳自己的座標。Google 地圖本來就知道你在哪，而且它的定位是持續
// 更新的；傳一個按下按鍵那一瞬間的座標快照進去，反而是在路線裡放了一個
// 過時的起點。「目前位置」更是完全不需要參數，硬傳還會多插一根搜尋圖釘。
// 只有導航的「目的地」是 Google 地圖不可能自己知道的，非傳不可。
//
// 以下三個是純函式，方便單獨驗證產生的 URL
function mapWebUrl(kind, dst){
  return kind === 'back'
    ? `https://www.google.com/maps/dir/?api=1&destination=${dst}&travelmode=bicycling`
    : 'https://www.google.com/maps';
}
// iOS：Google 地圖 App 的私有 scheme。未安裝時不會有任何反應，
// 因此呼叫端要準備逾時退路。省略 saddr 即代表以目前位置為起點。
function mapIosUrl(kind, dst){
  return kind === 'back'
    ? `comgooglemaps://?daddr=${dst}&directionsmode=bicycling`
    : 'comgooglemaps://';
}
// Android：intent:// 指定 package 直接叫出 Google 地圖，
// 並內建 browser_fallback_url——未安裝 App 時由系統自動退回網頁，
// 不需要自己做逾時判斷。
function mapAndroidUrl(kind, dst){
  const web = mapWebUrl(kind, dst);
  return 'intent://' + web.slice('https://'.length)
    + '#Intent;scheme=https;package=com.google.android.apps.maps'
    + ';S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
}

function gmapTarget(kind){
  // 「目前位置」不需要任何座標，連 GPS 都還沒定到位也能按
  if (kind !== 'back') return {kind, dst:''};
  if (!S.pos) return null;
  if (!S.track.length || !S.near) return null;
  const t = pointAt(S.along);
  return {kind, dst: `${t.lat.toFixed(6)},${t.lon.toFixed(6)}`};
}

function openWeb(url){
  // 新分頁／Custom Tab：本頁仍在，切回來即可
  let w = null;
  try { w = window.open(url, '_blank', 'noopener'); } catch(e){}
  if (!w) location.href = url;   // 真的開不了新分頁才跳轉
}

function openGmap(kind){
  const t = gmapTarget(kind);
  if (!t){
    el.banner.textContent = S.pos ? '尚未載入軌跡' : '尚未取得定位';
    return;
  }
  const web = mapWebUrl(t.kind, t.dst);
  if (!S.mapApp) return openWeb(web);

  if (IS_ANDROID){
    // intent:// 自帶退路，直接跳轉即可：有 App 就切到 App（本頁留在背景），
    // 沒有 App 系統才會走 fallback 開網頁。
    location.href = mapAndroidUrl(t.kind, t.dst);
    return;
  }
  if (IS_IOS){
    // 私有 scheme 未安裝時毫無反應，用「頁面有沒有被切到背景」判斷是否成功。
    let left = false;
    const gone = () => { left = true; };
    document.addEventListener('visibilitychange', gone);
    window.addEventListener('pagehide', gone);
    location.href = mapIosUrl(t.kind, t.dst);
    setTimeout(() => {
      document.removeEventListener('visibilitychange', gone);
      window.removeEventListener('pagehide', gone);
      if (!left && document.visibilityState === 'visible') openWeb(web);
    }, 1200);
    return;
  }
  openWeb(web);   // 桌機
}

/* ======================= 主迴圈 ======================= */
// 箭頭角度量化成 60 個區間（360/60 = 6°），中央那一區正好是螢幕正前方
// ±3°。角度落在中央區就維持正前方，超過 ±3° 才跳下一區。
// GPS 航向本身有一兩度的抖動，不量化的話箭頭會一直微微晃，反而難讀。
const BIN = 6;
// 純粹取最近區間的話，角度停在 3° 邊界上會在兩區之間反覆跳。
// 要再多超過 1.5° 才換區，臨界處就穩得住。
const BIN_HYST = 1.5;
function quantize(deg){
  if (S.bin !== null && Math.abs(wrap180(deg - S.bin)) <= BIN/2 + BIN_HYST) return S.bin;
  S.bin = Math.round(deg / BIN) * BIN;
  return S.bin;
}
function setArrow(deg){
  // 轉到最近的等效角度，避免 359→1 時整圈迴轉
  const delta = wrap180(quantize(deg) - S.shown);
  S.shown += delta;
  el.arrow.style.transform = `rotate(${S.shown}deg)`;
}

function update(){
  if (!S.pos || !S.track.length) { drawMap(); return; }

  // 搜尋範圍：沿軌跡前後各一段，避免折返路段誤吸到別的地方
  let from, to;
  if (!S.locked){ from = 0; to = S.track.length-1; }
  else {
    const here = S.cum[S.idx];
    from = idxAt(here - 400); to = idxAt(here + 1500);
  }
  const near = nearestOnTrack(S.pos, from, Math.max(from+1, to));
  // 離軌太遠代表可能整段跑掉，下一輪重新全域搜尋
  S.locked = near.d < 300;
  S.idx = near.i;
  S.near = near;
  S.side = near.side;

  const segLen = S.cum[near.i+1] - S.cum[near.i];
  const along = S.cum[near.i] + near.t * segLen;
  S.along = along;
  const remain = Math.max(0, S.total - along);
  const h = heading();

  // 偏離判定
  const off = near.d > S.thr;
  if (!off || (off && !S.off)) S.offRuns = 0;   // 重新偏離：第一聲立刻響
  S.off = off;
  document.body.classList.toggle('off', off);

  // 前方轉彎：偏離時不提示（當下要處理的是回到軌跡，不是下一個彎）
  const turn = off ? null : turnAhead(along, !!S.turn);
  const turnRise = !!turn && !S.turn;   // 只在「剛偵測到」時響一次
  S.turn = turn;
  document.body.classList.toggle('turn', !!turn);          // 對比用
  document.body.classList.toggle('turnR', !!turn && turn.dir === 'R');
  document.body.classList.toggle('turnL', !!turn && turn.dir === 'L');
  if (turnRise && Date.now() - S.lastTurnBeep > 6000){
    S.lastTurnBeep = Date.now();
    turnBeep(turn.dir);
    if (navigator.vibrate) navigator.vibrate(90);
  }

  // 箭頭目標：在軌上看前瞻點，離軌時直接指回最近點
  let target;
  if (off) target = pointAt(along);
  else {
    const look = clamp(S.speed * 6, S.look * 0.6, S.look * 2.2);
    const ahead = Math.max(S.look, look);
    target = pointAt(along + ahead);
    // GPX 多半錄的是路中心，實際卻是靠路邊騎，橫向固定偏個 2–3 m。
    // 瞄準路中心的一個點，箭頭就會持續偏 atan(偏移/前瞻)——3 m 配 60 m
    // 前瞻正好是 2.9°。把瞄準點往你所在的那一側平移同樣的量即可對消；
    // 平移量以「路寬補償」為上限，超出的部分保留，該把你導回線上時照樣導。
    const keep = clamp(S.side, -S.lane, S.lane);
    if (keep){
      const tb = trackBearingAt(along + ahead);
      if (tb !== null) target = movePoint(target, tb + 90, keep);
    }
  }

  document.body.classList.toggle('stale', h === null);
  let rel = null;
  if (h !== null && haversine(S.pos, target) > 3){
    rel = wrap180(bearing(S.pos, target) - h);
    setArrow(rel);
  }
  // 回到軌跡的最近點在身後（相對方位超過 ±120°）＝該掉頭，不是硬往前騎
  const back = off && rel !== null && Math.abs(rel) > 120;
  document.body.classList.toggle('back', back);
  // 沒有航向時，下格改以軌跡本身的行進方向朝上，形狀仍然可讀
  S.mapHead = h !== null ? h
    : bearing(pointAt(Math.max(0, along-5)), pointAt(Math.min(S.total, along+15)));

  // 讀數
  el.dev.textContent = Math.round(near.d);
  el.devLabel.textContent = off ? '偏離 公尺 — 回到軌跡'
    : '偏離 公尺' + (Math.abs(near.side) >= 1 ? (near.side > 0 ? '・右' : '・左') : '');
  el.spd.textContent = Math.round(S.speed * 3.6);
  el.remain.textContent = remain > 1000
    ? `剩餘 ${(remain/1000).toFixed(1)} km`
    : `剩餘 ${Math.round(remain)} m`;
  el.gmap.textContent = off ? '導航回軌跡' : '地圖';

  if (h === null) el.banner.textContent = '等待方向：先往前騎一段';
  else if (off) {
    el.banner.textContent = back
      ? `請掉頭 — 軌跡在後方 ${Math.round(near.d)} m`
      : `往箭頭方向回到軌跡 — ${Math.round(near.d)} m`;
    alarm();
  }
  else if (turn) {
    const d = Math.round(turn.dist);
    el.banner.textContent = (turn.dir === 'R' ? '右彎 ' : '左彎 ')
      + (d < 5 ? '就在前方' : `${d} m`)
      + `　${Math.abs(Math.round(turn.deg))}°`;
  }
  else if (remain < 25) el.banner.textContent = '抵達終點';
  else el.banner.textContent = '';

  drawMap();
}

/* ======================= 啟動 ======================= */
let wakeLock = null;
async function keepAwake(){
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && el.start.classList.contains('hide')) keepAwake();
});
window.addEventListener('resize', sizeMap);
window.addEventListener('orientationchange', () => setTimeout(sizeMap, 250));

function describeDirection(){
  if (!S.track.length){ el.dir.classList.remove('show'); return; }
  const a = S.track[0], b = S.track[S.track.length-1];
  const loop = haversine(a, b) < 100;
  const brg = bearing(a, b);
  el.dirText.innerHTML = loop
    ? `環狀路線（起訖點相距 ${Math.round(haversine(a,b))} m）。目前行進方向：<b>${S.rev ? '反向（逆原始點序）' : '正向（依原始點序）'}</b>`
    : `起點 → 終點：朝 <b>${compassName(brg)}</b>（${Math.round(brg)}°）。目前：<b>${S.rev ? '反向' : '正向'}</b>`;
  el.dir.classList.add('show');
}
function ready(n){
  el.status.textContent = `已載入 ${n} 個軌跡點，總長 ${(S.total/1000).toFixed(1)} km`;
  el.status.style.color = '#8fdc8f';
  el.go.disabled = false;
  el.go.textContent = '開始';   // 選了新檔就是新的一趟，還原流程會再覆蓋成「繼續騎乘」
  describeDirection();
}
function fail(msg){
  el.status.textContent = msg;
  el.status.style.color = '#ffb000';
  el.go.disabled = true;
  el.dir.classList.remove('show');
}
el.picker.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  el.status.textContent = `讀取 ${f.name}（${(f.size/1024).toFixed(1)} KB）…`;
  el.status.style.color = '#ffb000';
  const r = new FileReader();
  r.onerror = () => fail(`讀不到檔案 ${f.name}：${r.error ? r.error.name : '未知錯誤'}`);
  r.onload = () => {
    try { setTrack(parseGPX(r.result), f.name); ready(S.track.length); }
    catch(err){ fail(`${f.name}：${err.message}`); }
  };
  r.readAsText(f);
});

// ?gpx=route.gpx 自動載入（file:// 下瀏覽器會擋 fetch，必須用 http 伺服器或 Pages）
const qs = new URLSearchParams(location.search).get('gpx');
if (qs){
  if (location.protocol === 'file:'){
    fail('用 file:// 開啟時無法自動載入 GPX（瀏覽器安全限制），請改用 GitHub Pages／本機 http 伺服器，或直接在上面選檔。');
  } else {
    fetch(qs).then(r => { if(!r.ok) throw new Error('讀不到 ' + qs); return r.text(); })
      .then(t => { setTrack(parseGPX(t), qs); ready(S.track.length); })
      .catch(err => fail(err.message));
  }
}
if (location.protocol === 'file:'){
  el.hint.innerHTML = '目前是用 <code>file://</code> 開啟：<code>?gpx=</code> 自動載入與離線快取都不會生效，請改用 GitHub Pages 或本機 http 伺服器。';
}

el.go.addEventListener('click', () => {
  try { localStorage.setItem(RIDE_KEY, String(Date.now())); } catch(e){}
  el.start.classList.add('hide');
  initCompass();
  unlockAudio();                            // 借這次點擊解鎖 iOS 音訊（不出聲）
  keepAwake();
  sizeMap();
  navigator.geolocation.watchPosition(onPosition, err => {
    el.banner.textContent = '定位失敗：' + err.message;
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
});

/* 方向反轉（起始畫面與設定面板共用同一個可逆開關） */
function toggleDirection(){
  S.rev = !S.rev;
  if (S.raw.length) applyDirection();
  S.shown = 0; S.bin = null;
  el.arrow.style.transform = 'rotate(0deg)';
  syncDirButtons();
  describeDirection();
  savePrefs();
  update();
}
function syncDirButtons(){
  $('rev').classList.toggle('on', S.rev);
  $('rev').textContent = S.rev ? '軌跡方向：反向' : '軌跡方向：正向';
  $('revStart').textContent = S.rev ? '改回正向' : '反轉';
}
$('revStart').addEventListener('click', toggleDirection);
$('rev').addEventListener('click', () => { toggleDirection(); el.panel.classList.remove('show'); });

/* 設定 */
// 底部的地圖鍵隨狀態切換用途：在軌上看周邊，偏離時導航回最近的軌跡點
$('gmap').addEventListener('click', () => openGmap(S.off ? 'back' : 'here'));
$('gmapHere').addEventListener('click', () => { el.panel.classList.remove('show'); openGmap('here'); });
$('gmapBack').addEventListener('click', () => { el.panel.classList.remove('show'); openGmap('back'); });
$('gear').addEventListener('click', () => el.panel.classList.add('show'));
$('close').addEventListener('click', () => el.panel.classList.remove('show'));
$('thr').addEventListener('input', e => { S.thr = +e.target.value; $('thrV').textContent = S.thr; savePrefs(); update(); });
$('lk').addEventListener('input', e => { S.look = +e.target.value; $('lkV').textContent = S.look; savePrefs(); update(); });
function applyRange(){
  const i = RANGES.indexOf(S.range);
  $('rgV').textContent = S.range;
  $('rgNow').textContent = S.range + ' m';
  $('rgDn').disabled = i <= 0;
  $('rgUp').disabled = i >= RANGES.length-1;
  el.mapTag.textContent = `前方 ${S.range} m`;
}
function stepRange(d){
  const i = clamp(RANGES.indexOf(S.range) + d, 0, RANGES.length-1);
  S.range = RANGES[i];
  applyRange(); savePrefs(); update();
}
function applyLane(){
  const i = LANES.indexOf(S.lane);
  $('lnV').textContent = S.lane;
  $('lnNow').textContent = '±' + S.lane + ' m';
  $('lnDn').disabled = i <= 0;
  $('lnUp').disabled = i >= LANES.length-1;
}
function stepLane(d){
  S.lane = LANES[clamp(LANES.indexOf(S.lane) + d, 0, LANES.length-1)];
  applyLane(); savePrefs(); update();
}
function applySmooth(){
  const i = SMOOTHS.indexOf(S.smooth);
  $('smV').textContent = S.smooth;
  $('smNow').textContent = S.smooth ? S.smooth + ' 秒' : '關（直接用 GPS 航向）';
  $('smDn').disabled = i <= 0;
  $('smUp').disabled = i >= SMOOTHS.length-1;
}
function stepSmooth(d){
  S.smooth = SMOOTHS[clamp(SMOOTHS.indexOf(S.smooth) + d, 0, SMOOTHS.length-1)];
  applySmooth(); savePrefs(); update();
}
$('smDn').addEventListener('click', () => stepSmooth(-1));
$('smUp').addEventListener('click', () => stepSmooth(+1));
$('lnDn').addEventListener('click', () => stepLane(-1));
$('lnUp').addEventListener('click', () => stepLane(+1));
$('rgDn').addEventListener('click', () => stepRange(-1));
$('rgUp').addEventListener('click', () => stepRange(+1));
$('mapApp').addEventListener('click', e => {
  S.mapApp = !S.mapApp;
  e.currentTarget.classList.toggle('on', S.mapApp);
  e.currentTarget.textContent = S.mapApp ? '地圖用 App 開啟' : '地圖用網頁開啟';
  savePrefs();
});
$('snd').addEventListener('click', e => {
  S.sound = !S.sound;
  e.currentTarget.classList.toggle('on', S.sound);
  e.currentTarget.textContent = S.sound ? '警告音 開' : '警告音 關';
  savePrefs();
});
$('resync').addEventListener('click', () => { S.locked = false; el.panel.classList.remove('show'); update(); });

/* 套用已保存的設定 */
loadPrefs();
$('thr').value = S.thr;   $('thrV').textContent = S.thr;
$('lk').value  = S.look;  $('lkV').textContent  = S.look;
S.range = nearestRange(S.range);
applyRange();
S.lane = nearestLane(S.lane);
applyLane();
S.smooth = nearestSmooth(S.smooth);
applySmooth();
$('snd').classList.toggle('on', S.sound);
$('snd').textContent = S.sound ? '警告音 開' : '警告音 關';
$('mapApp').classList.toggle('on', S.mapApp);
$('mapApp').textContent = S.mapApp ? '地圖用 App 開啟' : '地圖用網頁開啟';
syncDirButtons();
sizeMap();

/* 還原上次的軌跡：頁面被系統回收後重新載入時，不必再選一次檔案。
   ?gpx= 有指定時以它為準。放在 loadPrefs() 之後，反轉方向才會跟著套用。 */
if (!qs){
  const saved = loadSavedTrack();
  if (saved){
    setTrack(saved.pts);             // 不傳 name，避免原樣再寫回一次
    ready(S.track.length);
    let riding = 0;
    try { riding = +localStorage.getItem(RIDE_KEY) || 0; } catch(e){}
    const mins = Math.round((Date.now() - saved.at)/60000);
    const when = mins < 60 ? `${mins} 分鐘前` : (mins < 1440 ? `${Math.round(mins/60)} 小時前` : `${Math.round(mins/1440)} 天前`);
    el.status.textContent = `${saved.name}（${when}載入）・${S.track.length} 點・${(S.total/1000).toFixed(1)} km`;
    // 12 小時內按過「開始」＝這趟還在騎，按鍵改成「繼續騎乘」。
    // 仍然需要這一下點擊：iOS 的羅盤權限與音訊解鎖都只能由使用者手勢觸發。
    if (riding && Date.now() - riding < 12*3600*1000) el.go.textContent = '繼續騎乘';
  }
}

/* 離線 */
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  // 快取優先讓離線可用，代價是新版要「開兩次」才看得到。改由 Service Worker
  // 在背景抓到新版時通知這裡：還停在起始畫面就直接重載，使用者不必知道
  // 有這回事。騎乘中則不動，免得中途把畫面洗掉。
  navigator.serviceWorker.addEventListener('message', ev => {
    if (!ev.data || ev.data.type !== 'gpsarrow-updated') return;
    if (el.start.classList.contains('hide')) return;      // 騎乘中，不打擾
    try {
      if (sessionStorage.getItem('gpsarrow.reloaded')) return;   // 一次啟動只重載一次
      sessionStorage.setItem('gpsarrow.reloaded', '1');
    } catch(e){}
    location.reload();
  });
}

})();
</script>
</body>
</html>
